[package]
name = "ak820-display-watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = "2.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
